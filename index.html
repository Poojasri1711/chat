<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Offline AI Lab Chatbot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Offline AI</div>
    <button id="newChat" class="new-chat">+ New chat</button>
    <div id="chatList" class="chat-list"></div>
    <div class="sidebar-footer">
      <div id="serverInfo">Checking server...</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Offline AI Lab Chatbot</h1>
        <div id="status" class="status">Checking...</div>
      </div>
      <button id="clearBtn" class="secondary">Clear</button>
    </header>

    <section id="messages" class="messages">
      <div class="welcome">
        <h2>Offline AI Assistant</h2>
        <p>This chatbot communicates only with the local lab server.</p>
        <p>Internet is not required once the host is running.</p>
      </div>
    </section>

    <form id="chatForm" class="composer">
      <textarea id="input" rows="2"
        placeholder="Ask something... (Enter to send, Shift+Enter for new line)"></textarea>
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </main>

<script src="/static/app.js"></script>
</body>
</html>
